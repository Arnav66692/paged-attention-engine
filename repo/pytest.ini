[pytest]
testpaths = tests

markers =
    slow: opt-in checks too slow for the default run. Enable with `-m slow`.

# The recompute baseline is O(n^2) in generated tokens and is not needed on
# every run. It stays available -- `-m slow` selects it, and a later `-m` on the
# command line overrides this one.
addopts = -m "not slow"
