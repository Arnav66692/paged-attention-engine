name: CI
on:
  push:
    branches: [main, codex/review-readiness]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    name: CPU / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [core, parity, fused, sched, attention_gqa, parity_fp16]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run every test in the assigned module, including slow tests
        shell: bash
        run: |
          if [ "${{ matrix.suite }}" = core ]; then
            python -m pytest -q -m 'slow or not slow' tests/test_alloc.py tests/test_ampere_recheck.py tests/test_arms.py tests/test_bench.py tests/test_bench_plots.py tests/test_kaggle_session.py tests/test_selection.py
            python scripts/plot_headline.py
          else
            python -m pytest -q -m 'slow or not slow' "tests/test_${{ matrix.suite }}.py"
          fi
  verify:
    name: Verify
    if: always()
    needs: cpu
    runs-on: ubuntu-latest
    steps:
      - name: Require all CPU suites
        env:
          RESULT: ${{ needs.cpu.result }}
        run: test "$RESULT" = success
